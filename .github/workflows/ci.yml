name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/evaluate.py
      - run: python scripts/verify_live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: synthetic-smoke-evaluation-${{ matrix.os }}
          path: artifacts/evaluation.json
          retention-days: 7
  postgres-foundation:
    strategy:
      fail-fast: false
      matrix:
        credentials: [lf, crlf, legacy-crlf]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Generate isolated development credentials
        run: python scripts/postgres_local.py prepare
      - name: Reproduce Windows credentials and legacy bootstrap
        if: matrix.credentials != 'lf'
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.local/postgres').iterdir():
              data = path.read_bytes().rstrip(b'\r\n')
              path.chmod(0o644)
              path.write_bytes(data + b'\r\n')
              path.chmod(0o444)
          PY
      - name: Restore legacy role bootstrap for recovery regression
        if: matrix.credentials == 'legacy-crlf'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('infra/postgres/001-roles.sh')
          path.write_text(path.read_text().replace("tr -d '\\r\\n' <", "cat"))
          PY
      - name: Start real PostgreSQL 17
        run: docker compose -f compose.postgres.yaml up -d --wait
      - name: Reproduce original authentication failure without exposing credentials
        if: matrix.credentials == 'legacy-crlf'
        run: |
          python - <<'PY'
          import subprocess
          command = ["docker", "compose", "-f", "compose.postgres.yaml", "exec", "-T",
                     "postgres", "sh", "-c", 'export PGPASSWORD="$(cat /run/secrets/admin_password)"; exec psql -X -h 127.0.0.1 -U maintain_admin -d maintain -c "SELECT 1;"']
          result = subprocess.run(command, capture_output=True, text=True, timeout=30)
          assert result.returncode != 0 and "password authentication failed" in result.stderr
          print("PASS legacy_crlf_authentication_failure_reproduced")
          PY
      - name: Verify fresh bootstrap credentials before any repair
        if: matrix.credentials != 'legacy-crlf'
        run: |
          python - <<'PY'
          from scripts.postgres_local import ROLE_CONFIG, scalar
          for role, (user, _) in ROLE_CONFIG.items():
              assert scalar("SELECT current_user;", role) == user
          print("PASS fresh_role_authentication")
          PY
      - name: Repair existing credentials and verify repeatability
        run: |
          python scripts/postgres_local.py repair-passwords
          python scripts/postgres_local.py repair-passwords
      - name: Apply migrations and verify repeatability
        run: |
          python scripts/postgres_local.py migrate
          python scripts/postgres_local.py migrate
      - name: Verify real role authentication and isolation
        run: python scripts/postgres_local.py verify
      - name: Remove disposable CI database
        if: always()
        run: docker compose -f compose.postgres.yaml down --volumes

  postgres-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAINTAIN_PG_PORT: '25432'
      MAINTAIN_PG_TEST_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/postgres_local.py prepare
      - run: docker compose -f compose.postgres.yaml up -d --wait
      - run: python scripts/postgres_local.py migrate
      - name: Verify real PostgreSQL HTTP server and CLI dispatch
        run: python scripts/verify_live.py --postgres
      - name: Exercise shared API contracts, real authentication and concurrent workers
        run: python -m pytest -q tests/test_postgres_api.py
      - name: Remove disposable CI database
        if: always()
        run: docker compose -f compose.postgres.yaml down --volumes
