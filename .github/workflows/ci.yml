name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/evaluate.py
      - run: python scripts/verify_live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: synthetic-smoke-evaluation-${{ matrix.os }}
          path: artifacts/evaluation.json
          retention-days: 7
  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Generate isolated development credentials
        run: python scripts/postgres_local.py prepare
      - name: Start real PostgreSQL 17
        run: docker compose -f compose.postgres.yaml up -d --wait
      - name: Apply migrations and verify repeatability
        run: |
          python scripts/postgres_local.py migrate
          python scripts/postgres_local.py migrate
      - name: Verify real role authentication and isolation
        run: python scripts/postgres_local.py verify
      - name: Remove disposable CI database
        if: always()
        run: docker compose -f compose.postgres.yaml down --volumes
